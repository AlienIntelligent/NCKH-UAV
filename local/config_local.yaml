# ══════════════════════════════════════════════════════════════════════
#  config_local.yaml — chạy LOCAL (máy có GPU)
#  THIẾT KẾ ĐÚNG: surrogate train trên DOTA, target (giữ kín) train trên DIOR
#  → khác KIẾN TRÚC lẫn DỮ LIỆU. Patch tối ưu trên DOTA, đo transfer trên DIOR.
# ══════════════════════════════════════════════════════════════════════

paths:
  dota_images: "D:/ADVER-ATTAC/NCKH-UAV/data/DOTA/raw/dota_raw/images"
  dota_labels: "D:/ADVER-ATTAC/NCKH-UAV/data/DOTA/raw/dota_raw/labelTxt"
  dior_jpeg:   "D:/ADVER-ATTAC/NCKH-UAV/data/DIOR/raw/dior_raw/JPEGImages"
  dior_ann:    "D:/ADVER-ATTAC/NCKH-UAV/data/DIOR/raw/dior_raw/Annotations"

  work_dir:   "D:/ADVER-ATTAC/NCKH-UAV/data"          # yolo_dota/ + yolo_dior/
  runs_dir:   "D:/ADVER-ATTAC/NCKH-UAV/runs"
  attack_dir: "D:/ADVER-ATTAC/NCKH-UAV/attack_results"

environment:
  device: "0"        # "0" = GPU 0 ; "0,1" = 2 GPU ; "cpu"
  seed: 42

run:
  stages: ["prepare", "surrogate", "target", "attack"]

# ── Surrogate = YOLOv8n train trên DOTA-only (nhóm tối ưu) ──
surrogate:
  reuse: false
  weights: ""        # DOTA-only best.pt nếu đã có (vd v4). KHÔNG dùng model train trên dữ liệu gộp.
  epochs: 50
  imgsz: 1024
  batch: 8

# ── Target = RT-DETR-l train trên DIOR-only (nhóm giữ kín) ──
target:
  reuse: false
  weights: ""
  epochs: 50
  imgsz: 640
  batch: 8

train_common:
  patience: 15
  cache: true
  split_ratio: 0.8

# ── Tấn công DE + tối ưu vị trí + ĐỐI CHỨNG ngẫu nhiên ──
attack:
  n_attack: 30       # ảnh DOTA để tối ưu patch
  n_heldout: 50      # ảnh đánh giá held-out (DOTA cho surrogate, DIOR cho transfer)
  pop_size: 20
  max_gen: 50
  F: 0.8
  CR: 0.7
  w_obj: 1.0
  w_fp: 0.3
  w_tv: 0.01
  w_nps: 0.001
  # random=true → KHÔNG tối ưu, chỉ patch ngẫu nhiên cùng diện tích (đối chứng bắt buộc)
  # TẤT CẢ cấu hình cùng tổng diện tích 1024 px² để so sánh công bằng:
  #   1×32² = 1024  ==  4×16² = 1024
  configs:
    - {name: "random_single",   patch_size: 32, num_patches: 1, optimize_positions: false, random: true}
    - {name: "baseline_center", patch_size: 32, num_patches: 1, optimize_positions: false, random: false}
    - {name: "opt_position",    patch_size: 32, num_patches: 1, optimize_positions: true,  random: false}
    - {name: "multi_patch_opt", patch_size: 16, num_patches: 4, optimize_positions: true,  random: false}
